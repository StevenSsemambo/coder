<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: on Android the page shrinks when the keyboard opens, so the bottom dock sits just above it -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b6b4f" />
    <meta name="description" content="SayMaCoder: learn to code on your phone with no data and no subscription. Works fully offline." />
    <link rel="icon" type="image/svg+xml" href="./icons/logo.svg" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>SayMaCoder</title>
    <style>
      /* Launch screen: plain HTML and CSS so it shows at once, before any JavaScript has loaded. */
      html, body { margin: 0; background: #06261d; }
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); color: #fff; text-align: center; overflow: hidden;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(120% 80% at 50% 28%, #0f4a38 0%, #08301f00 70%), linear-gradient(180deg, #0b6b4f 0%, #06261d 62%); transition: opacity .35s ease, visibility .35s; }
      #splash.gone { opacity: 0; visibility: hidden; }
      #splash .grid { position: absolute; inset: 0; opacity: .07; pointer-events: none;
        background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px); background-size: 36px 36px;
        -webkit-mask-image: radial-gradient(circle at 50% 40%, #000, transparent 70%); mask-image: radial-gradient(circle at 50% 40%, #000, transparent 70%); }
      #splash .logo { position: relative; width: 112px; height: 112px; filter: drop-shadow(0 14px 34px rgba(0,0,0,.45)); animation: pop .6s cubic-bezier(.2,.9,.3,1.3) both; }
      #splash .logo::after { content: ""; position: absolute; inset: -26px; z-index: -1; border-radius: 50%; background: radial-gradient(circle, rgba(143,240,196,.28), transparent 65%); }
      #splash h1 { margin: 26px 0 0; font-size: 2.1rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; animation: rise .5s .15s ease both; }
      #splash h1 b { color: #8ff0c4; font-weight: 800; }
      #splash .tag { margin: 10px 0 0; font-size: 1rem; color: #bfe3d3; animation: rise .5s .25s ease both; }
      #splash .term { margin: 30px 0 0; padding: 10px 16px; border-radius: 12px; background: rgba(0,0,0,.32); border: 1px solid rgba(255,255,255,.1);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92rem; color: #d7f5e8; animation: rise .5s .35s ease both; }
      #splash .term i { color: #ffc94d; font-style: normal; }
      #splash .term .cur { display: inline-block; width: .55em; height: 1.05em; margin-left: 3px; vertical-align: -.18em; background: #8ff0c4; animation: blink 1s steps(1) infinite; }
      #splash .bar { margin-top: 34px; width: min(220px, 56vw); height: 4px; border-radius: 4px; background: rgba(255,255,255,.14); overflow: hidden; }
      #splash .bar span { display: block; height: 100%; width: 40%; border-radius: 4px; background: linear-gradient(90deg, #8ff0c4, #ffc94d); animation: slide 1.3s ease-in-out infinite; }
      #splash .foot { position: absolute; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom)); font-size: .82rem; color: #8fbfa9; letter-spacing: .04em; }
      #splash .slow { margin-top: 18px; max-width: 300px; font-size: .9rem; color: #ffd98a; opacity: 0; transition: opacity .4s; }
      #splash.late .slow { opacity: 1; }
      @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; transition: none !important; } }
      @media (max-height: 520px) { #splash .term, #splash .foot { display: none; } }
      .cursor { animation: blink 1s steps(1) infinite; }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="SayMaCoder is loading">
      <div class="grid" aria-hidden="true"></div>
      <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15a077"/><stop offset=".55" stop-color="#0b6b4f"/><stop offset="1" stop-color="#06402e"/></linearGradient>
    <radialGradient id="sshine" cx=".25" cy=".15" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#sbg)"/><rect width="512" height="512" rx="116" fill="url(#sshine)"/>
  <g transform="translate(256 256) scale(1) translate(-256 -256)">
    <path d="M176 182 L96 252 L176 322" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M336 182 L416 252 L336 322" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M282 164 L230 340" fill="none" stroke="#ffc94d" stroke-width="46" stroke-linecap="round"/>
    <rect class="cursor" x="190" y="384" width="132" height="28" rx="14" fill="#8ff0c4"/>
  </g>
</svg>
      <h1>SayMa<b>Coder</b></h1>
      <p class="tag">Learn to code. Free. Offline.</p>
      <div class="term" aria-hidden="true"><i>$</i> print("Hello, world!")<span class="cur"></span></div>
      <div class="bar" aria-hidden="true"><span></span></div>
      <p class="slow">Still loading. Check your connection, then reload the page.</p>
      <div class="foot" aria-hidden="true">From zero to pro, one small step at a time</div>
    </div>
    <div id="app"></div>
    <noscript>SayMaCoder needs JavaScript to run.</noscript>
    <script>
      // If the app has not started after 12 seconds, say so kindly instead of showing a screen that never changes.
      window.__splashStart = Date.now();
      setTimeout(function () { var s = document.getElementById('splash'); if (s) s.classList.add('late'); }, 12000);
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
